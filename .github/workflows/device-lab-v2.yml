name: Build ChatGPT Device Lab v2 APK

on:
  push:
    branches: ["chatgpt-device-lab-v2"]
    paths-ignore:
      - "dist/**"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Reconstruct source archive
        run: |
          cat source_chunks_v2_fixed/*.b64 | base64 --decode > chatgpt_device_lab_v2_project.zip
          echo "b4c66d81d396029886b394bd8a822198bc5470d70f346407c8efd6c01242c698  chatgpt_device_lab_v2_project.zip" | sha256sum -c -
          unzip -q chatgpt_device_lab_v2_project.zip -d build-src
      - name: Build debug APK
        working-directory: build-src/chatgpt_device_lab_v2
        run: gradle --no-daemon assembleDebug
      - name: Stage APK
        run: |
          mkdir -p dist
          cp build-src/chatgpt_device_lab_v2/app/build/outputs/apk/debug/app-debug.apk dist/ChatGPT-Device-Lab-v2-debug.apk
          sha256sum dist/ChatGPT-Device-Lab-v2-debug.apk | tee dist/ChatGPT-Device-Lab-v2-debug.apk.sha256
      - name: Publish APK on branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ChatGPT-Device-Lab-v2-debug.apk dist/ChatGPT-Device-Lab-v2-debug.apk.sha256
          if git diff --cached --quiet; then
            echo "No APK changes"
          else
            git commit -m "Build ChatGPT Device Lab v2 APK [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-device-lab-v2-debug-apk
          path: |
            dist/ChatGPT-Device-Lab-v2-debug.apk
            dist/ChatGPT-Device-Lab-v2-debug.apk.sha256
