name: Produce xuci1.0 Alpha APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xuci-builder-main.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-xuci:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout xuci source branch
        uses: actions/checkout@v4
        with:
          ref: xuci-alpha-build
          path: source

      - name: Checkout artifact branch
        uses: actions/checkout@v4
        with:
          ref: xuci-alpha-artifact
          path: artifact

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Build debug APK
        working-directory: source/xuci1.0-alpha
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Export build artifact
        run: |
          set -euo pipefail
          APK='source/xuci1.0-alpha/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          mkdir -p artifact/xuci-build-output
          base64 -w0 "$APK" > artifact/xuci-build-output/xuci1.0-alpha-debug.apk.b64
          sha256sum "$APK" | awk '{print $1}' > artifact/xuci-build-output/xuci1.0-alpha-debug.apk.sha256
          stat --printf='%s\n' "$APK" > artifact/xuci-build-output/xuci1.0-alpha-debug.apk.size
          date -u +'%Y-%m-%dT%H:%M:%SZ' > artifact/xuci-build-output/built-at.txt

      - name: Commit artifact to isolated branch
        working-directory: artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add xuci-build-output
          if git diff --cached --quiet; then
            echo 'Artifact is unchanged'
          else
            git commit -m 'build: xuci1.0 alpha debug APK'
            git push origin HEAD:xuci-alpha-artifact
          fi
