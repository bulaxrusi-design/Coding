name: Build xuci1.0 Local Engine v0.3

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/xuci-local-engine-v03.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-local-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout trigger branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install native Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-36' \
            'build-tools;35.0.0' \
            'platform-tools' \
            'ndk;29.0.13113456' \
            'cmake;3.31.6'

      - name: Clone pinned llama.cpp Android engine
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git engine
          cd engine
          git checkout fe2adf0e722f30f5295fdec8a0f1dc788f7498bc
          git rev-parse HEAD

      - name: Apply stable xuci local-engine identity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('engine/examples/llama.android')
          app = root / 'app/build.gradle.kts'
          lib = root / 'lib/build.gradle.kts'

          app_text = app.read_text()
          app_text = app_text.replace('applicationId = "com.example.llama.aichat"', 'applicationId = "ai.xuci.one.local"')
          app_text = app_text.replace('minSdk = 33', 'minSdk = 28')
          app_text = app_text.replace('versionCode = 1', 'versionCode = 3')
          app_text = app_text.replace('versionName = "1.0"', 'versionName = "0.3.0-local-alpha"')
          app.write_text(app_text)

          lib_text = lib.read_text()
          lib_text = lib_text.replace('minSdk = 33', 'minSdk = 28')
          lib_text = lib_text.replace('listOf("arm64-v8a", "x86_64")', 'listOf("arm64-v8a")')
          lib.write_text(lib_text)

          strings = root / 'app/src/main/res/values/strings.xml'
          strings.write_text('''<resources>\n    <string name="app_name">xuci1.0 Local</string>\n</resources>\n''')
          PY

      - name: Build official local-inference UI and ARM64 engine
        working-directory: engine/examples/llama.android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK, native engine, and signature block
        run: |
          set -euo pipefail
          APK='engine/examples/llama.android/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep 'AndroidManifest.xml'
          unzip -l "$APK" | grep 'classes.dex'
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/.*\.so'
          grep -a -q 'APK Sig Block 42' "$APK"
          cp "$APK" xuci1.0-local-v0.3-debug.apk
          sha256sum xuci1.0-local-v0.3-debug.apk | tee xuci1.0-local-v0.3.apk.sha256
          stat --printf='APK bytes: %s\n' xuci1.0-local-v0.3-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: xuci1.0-local-v0.3-apk
          path: |
            xuci1.0-local-v0.3-debug.apk
            xuci1.0-local-v0.3.apk.sha256
          if-no-files-found: error
          retention-days: 7
