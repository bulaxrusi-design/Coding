name: Build xuci1.0 Cloud Guest APK

on:
  push:
    branches: [xuci-cloud-guest-v04]
    paths:
      - 'source_chunks_cloud/**'
      - '.github/workflows/xuci-cloud-guest-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'source_chunks_cloud/**'
      - '.github/workflows/xuci-cloud-guest-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Reconstruct Cloud Guest source
        run: |
          cat source_chunks_cloud/part-000.b64 source_chunks_cloud/part-001-*.b64 > xuci-cloud-source.b64
          base64 --decode xuci-cloud-source.b64 > xuci-cloud-source.zip
          unzip -t xuci-cloud-source.zip
          mkdir -p build-src
          unzip -q xuci-cloud-source.zip -d build-src
          test -f build-src/xuci_cloud_project/app/src/main/java/ai/xuci/one/MainActivity.java

      - name: Build debug APK
        working-directory: build-src/xuci_cloud_project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify and stage APK
        run: |
          SRC=build-src/xuci_cloud_project/app/build/outputs/apk/debug/app-debug.apk
          test -f "$SRC"
          unzip -t "$SRC"
          mkdir -p dist/xuci-cloud
          cp "$SRC" dist/xuci-cloud/xuci1.0-cloud-guest-v0.4-debug.apk
          sha256sum dist/xuci-cloud/xuci1.0-cloud-guest-v0.4-debug.apk | tee dist/xuci-cloud/xuci1.0-cloud-guest-v0.4-debug.apk.sha256

      - name: Publish APK on branch
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/xuci-cloud/xuci1.0-cloud-guest-v0.4-debug.apk dist/xuci-cloud/xuci1.0-cloud-guest-v0.4-debug.apk.sha256
          if git diff --cached --quiet; then
            echo 'No APK changes'
          else
            git commit -m 'Build xuci Cloud Guest APK [skip ci]'
            git push
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xuci1.0-cloud-guest-apk
          path: |
            dist/xuci-cloud/xuci1.0-cloud-guest-v0.4-debug.apk
            dist/xuci-cloud/xuci1.0-cloud-guest-v0.4-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
