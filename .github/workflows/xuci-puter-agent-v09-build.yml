name: Build xuci1.0 Puter Agent APK

on:
  push:
    branches: [xuci-puter-agent-v09]
    paths:
      - 'xuci_puter_agent_v09/**'
      - '.github/workflows/xuci-puter-agent-v09-build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Reconstruct source
        run: |
          cat xuci_puter_agent_v09/chunk_* | base64 -d > /tmp/xuci-puter-agent-v09-source.zip
          echo '2fb43141116c2214255b7241148760decfbae42a06771254b934a5a8eff34012  /tmp/xuci-puter-agent-v09-source.zip' | sha256sum -c -
          unzip -t /tmp/xuci-puter-agent-v09-source.zip
          unzip -q /tmp/xuci-puter-agent-v09-source.zip
          test -f xuci_puter_agent_v09/app/src/main/assets/index.html
          test -f xuci_puter_agent_v09/app/src/main/java/ai/xuci/toolhub/MainActivity.java
          grep -q 'versionCode 9' xuci_puter_agent_v09/app/build.gradle
          grep -q 'puter.ai.chat' xuci_puter_agent_v09/app/src/main/assets/index.html

      - name: Build debug APK
        working-directory: xuci_puter_agent_v09
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify and stage APK
        run: |
          APK=xuci_puter_agent_v09/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK"
          mkdir -p dist
          cp "$APK" dist/xuci1.0-puter-agent-v0.9-debug.apk
          sha256sum dist/xuci1.0-puter-agent-v0.9-debug.apk | tee dist/xuci1.0-puter-agent-v0.9-debug.apk.sha256
          unzip -l "$APK" | grep -E 'AndroidManifest.xml|classes.dex|resources.arsc|assets/index.html'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xuci1.0-puter-agent-v09-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 14
