name: Build xuci2 Cloud Gemini APK

on:
  push:
    branches: [xuci2-cloud-gemini]
    paths:
      - 'xuci2_payload/**'
      - '.github/workflows/xuci2-build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Reconstruct source
        run: |
          cat xuci2_payload/chunk_* | tr -cd 'A-Za-z0-9+/=' | base64 -d > /tmp/xuci2-source.zip
          sha256sum /tmp/xuci2-source.zip
          test "$(sha256sum /tmp/xuci2-source.zip | cut -d' ' -f1)" = "8664d9722cd886ce8302838f38e617fd21abfcf574217194cf789d51338b3824"
          unzip -t /tmp/xuci2-source.zip
          unzip -q /tmp/xuci2-source.zip
          test -f xuci2/app/src/main/java/ai/xuci/two/MainActivity.java
          test -f xuci2/app/src/main/java/ai/xuci/two/AgentController.java

      - name: Build debug APK
        working-directory: xuci2
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify and stage APK
        run: |
          APK=xuci2/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK"
          mkdir -p dist
          cp "$APK" dist/xuci2.0-cloud-gemini-debug.apk
          sha256sum dist/xuci2.0-cloud-gemini-debug.apk | tee dist/xuci2.0-cloud-gemini-debug.apk.sha256
          unzip -l "$APK" | grep -E 'AndroidManifest.xml|classes.dex|resources.arsc'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xuci2-cloud-gemini-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 14
