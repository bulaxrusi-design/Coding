name: Build xuci2 Cloud Gemini APK

on:
  push:
    branches: [xuci2-cloud-gemini]
    paths:
      - 'xuci2_exact_payload/**'
      - 'xuci2_exact_tail/**'
      - '.github/workflows/xuci2-build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Reconstruct exact source
        run: |
          python3 - <<'PY'
          import base64, glob, hashlib
          paths = sorted(glob.glob('xuci2_exact_payload/part_*')) + sorted(glob.glob('xuci2_exact_tail/tail_*'))
          assert len(paths) == 14, paths
          encoded = ''.join(open(p, encoding='utf-8').read() for p in paths)
          assert len(encoded) == 43816, len(encoded)
          data = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(data).hexdigest()
          print('ZIP_SHA256', digest, 'BYTES', len(data))
          assert digest == '8664d9722cd886ce8302838f38e617fd21abfcf574217194cf789d51338b3824'
          open('/tmp/xuci2-source.zip', 'wb').write(data)
          PY
          unzip -t /tmp/xuci2-source.zip
          unzip -q /tmp/xuci2-source.zip
          test -f xuci2/app/src/main/java/ai/xuci/two/MainActivity.java
          test -f xuci2/app/src/main/java/ai/xuci/two/AgentController.java

      - name: Build debug APK
        working-directory: xuci2
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify and stage APK
        run: |
          APK=xuci2/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK"
          mkdir -p dist
          cp "$APK" dist/xuci2.0-cloud-gemini-debug.apk
          sha256sum dist/xuci2.0-cloud-gemini-debug.apk | tee dist/xuci2.0-cloud-gemini-debug.apk.sha256
          unzip -l "$APK" | grep -E 'AndroidManifest.xml|classes.dex|resources.arsc'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xuci2-cloud-gemini-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 14
