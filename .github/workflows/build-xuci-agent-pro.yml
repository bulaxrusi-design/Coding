name: Build Xuci Agent Pro

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'xuci-agent-pro-v3-source.tar.gz.b64'
      - 'XUCI_AGENT_PRO_V3.md'
      - '.github/workflows/build-xuci-agent-pro.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack source project
        run: |
          mkdir -p xuci-agent-pro
          base64 --decode xuci-agent-pro-v3-source.tar.gz.b64 > /tmp/xuci-agent-pro-v3-source.tar.gz
          tar -xzf /tmp/xuci-agent-pro-v3-source.tar.gz -C xuci-agent-pro
          test -f xuci-agent-pro/app/src/main/java/ai/xuci/agent/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK from source
        run: gradle -p xuci-agent-pro :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp xuci-agent-pro/app/build/outputs/apk/debug/app-debug.apk artifact/Xuci-Agent-Pro-v3-debug.apk
          sha256sum artifact/Xuci-Agent-Pro-v3-debug.apk | tee artifact/SHA256SUMS.txt
          cp /tmp/xuci-agent-pro-v3-source.tar.gz artifact/Xuci-Agent-Pro-v3-source.tar.gz
          cp xuci-agent-pro/README.md artifact/README.md

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: xuci-agent-pro-v3-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 30
