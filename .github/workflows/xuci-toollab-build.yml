name: Build xuci ToolLab APK

on:
  push:
    branches: [xuci-toollab-v06]
    paths:
      - 'xuci-toollab-build/**'
      - '.github/workflows/xuci-toollab-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'xuci-toollab-build/**'
      - '.github/workflows/xuci-toollab-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct ToolLab source
        run: |
          sha256sum xuci-toollab-build/chunks/*
          cat xuci-toollab-build/chunks/* > /tmp/xuci-toollab.b64
          base64 -d /tmp/xuci-toollab.b64 > /tmp/xuci-toollab.zip
          sha256sum /tmp/xuci-toollab.zip
          unzip -t /tmp/xuci-toollab.zip
          unzip -oq /tmp/xuci-toollab.zip -d .
          test -f xuci-toollab/app/src/main/java/ai/xuci/one/MainActivity.java
          test -f xuci-toollab/app/src/main/assets/setup-xuci.sh
          test -f xuci-toollab/app/build.gradle
          bash -n xuci-toollab/app/src/main/assets/setup-xuci.sh

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Build debug APK
        working-directory: xuci-toollab
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify and stage APK
        run: |
          SRC=xuci-toollab/app/build/outputs/apk/debug/app-debug.apk
          test -f "$SRC"
          unzip -t "$SRC"
          mkdir -p dist/xuci-toollab
          cp "$SRC" dist/xuci-toollab/xuci1.0-toollab-v0.6-debug.apk
          sha256sum dist/xuci-toollab/xuci1.0-toollab-v0.6-debug.apk | tee dist/xuci-toollab/xuci1.0-toollab-v0.6-debug.apk.sha256
          unzip -l "$SRC" | grep -E 'AndroidManifest.xml|classes.dex|xuci_robot|setup-xuci.sh'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xuci1.0-toollab-apk
          path: |
            dist/xuci-toollab/xuci1.0-toollab-v0.6-debug.apk
            dist/xuci-toollab/xuci1.0-toollab-v0.6-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
