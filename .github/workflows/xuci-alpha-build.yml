name: Build xuci1.0 Local Bridge APK

on:
  push:
    branches: [xuci-local-bridge-v1]
    paths:
      - 'xuci1.0-alpha/**'
      - '.github/workflows/xuci-alpha-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Build debug APK
        working-directory: xuci1.0-alpha
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify artifact
        run: |
          APK=xuci1.0-alpha/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK"
          sha256sum "$APK" | tee xuci1.0-alpha/app-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xuci1.0-local-bridge-apk
          path: |
            xuci1.0-alpha/app/build/outputs/apk/debug/app-debug.apk
            xuci1.0-alpha/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
