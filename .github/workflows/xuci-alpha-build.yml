name: Build xuci1.0 Local Bridge APK

on:
  push:
    branches: [xuci-local-bridge-v1]
    paths:
      - 'xuci1.0-alpha/**'
      - '.github/workflows/xuci-alpha-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'xuci1.0-alpha/**'
      - '.github/workflows/xuci-alpha-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Build debug APK
        working-directory: xuci1.0-alpha
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify and stage APK
        run: |
          SRC=xuci1.0-alpha/app/build/outputs/apk/debug/app-debug.apk
          test -f "$SRC"
          unzip -t "$SRC"
          mkdir -p dist/xuci-local
          cp "$SRC" dist/xuci-local/xuci1.0-local-bridge-v0.3-debug.apk
          sha256sum dist/xuci-local/xuci1.0-local-bridge-v0.3-debug.apk | tee dist/xuci-local/xuci1.0-local-bridge-v0.3-debug.apk.sha256

      - name: Publish APK on branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/xuci-local/xuci1.0-local-bridge-v0.3-debug.apk dist/xuci-local/xuci1.0-local-bridge-v0.3-debug.apk.sha256
          if git diff --cached --quiet; then
            echo "No APK changes"
          else
            git commit -m "Build xuci local bridge APK [skip ci]"
            git push
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xuci1.0-local-bridge-apk
          path: |
            dist/xuci-local/xuci1.0-local-bridge-v0.3-debug.apk
            dist/xuci-local/xuci1.0-local-bridge-v0.3-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
