name: Build Ursafe Remote QA APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ursafe-builder.yml'
  pull_request:
    branches: [main]
    paths:
      - '.ursafe-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ursafe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Ursafe source
        uses: actions/checkout@v4
        with:
          ref: ursafe-v02-build
          path: source

      - name: Checkout artifact branch
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: ursafe-v02-artifact
          path: artifact

      - name: Apply Ursafe Remote QA v2.0 source bundle
        working-directory: source
        run: |
          set -euo pipefail
          test "$(find .ursafe -maxdepth 1 -name 'remote-qa-v2.0-patch.part*' | wc -l)" -eq 7
          cat .ursafe/remote-qa-v2.0-patch.part00 \
              .ursafe/remote-qa-v2.0-patch.part01 \
              .ursafe/remote-qa-v2.0-patch.part02 \
              .ursafe/remote-qa-v2.0-patch.part03 \
              .ursafe/remote-qa-v2.0-patch.part04 \
              .ursafe/remote-qa-v2.0-patch.part05 \
              .ursafe/remote-qa-v2.0-patch.part06 \
              | base64 -d > /tmp/ursafe-v2-patch.tar.gz
          echo '0158eb5fa3463acf1e9ce67f3ca36732419fe794f9f0f4eb4bcd16563c42974f  /tmp/ursafe-v2-patch.tar.gz' | sha256sum -c -
          tar -xzf /tmp/ursafe-v2-patch.tar.gz -C .
          rm -f \
            app/src/main/java/com/ursafe/app/NumberMatchAgent.java \
            app/src/main/java/com/ursafe/app/NumberMatchCalibration.java
          if grep -R --line-number 'NumberMatchAgent\|NumberMatchCalibration' app/src/main/java app/src/main/AndroidManifest.xml; then
            echo 'Number Match-specific code is still referenced' >&2
            exit 1
          fi
          grep -q 'versionName = "2.0.0"' app/build.gradle.kts
          grep -q 'signed command v2' app/src/main/java/com/ursafe/app/AgentActivityV12.java

      - name: Normalize SafeJson overloads
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/ursafe/app/QaSessionManager.java')
          text = path.read_text(encoding='utf-8')
          marker = 'private static final class SafeJson extends JSONObject {'
          if marker not in text:
              raise SystemExit('SafeJson marker missing')
          if 'put(String name, boolean value)' not in text:
              overloads = '''private static final class SafeJson extends JSONObject {
                  @Override public SafeJson put(String name, boolean value) {
                      try { super.put(name, value); } catch (Exception ignored) {}
                      return this;
                  }
                  @Override public SafeJson put(String name, double value) {
                      try { super.put(name, value); } catch (Exception ignored) {}
                      return this;
                  }
                  @Override public SafeJson put(String name, int value) {
                      try { super.put(name, value); } catch (Exception ignored) {}
                      return this;
                  }
                  @Override public SafeJson put(String name, long value) {
                      try { super.put(name, value); } catch (Exception ignored) {}
                      return this;
                  }'''
              text = text.replace(marker, overloads, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Build debug APK
        working-directory: source
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          APK='source/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          unzip -t "$APK"
          sha256sum "$APK"
          test "$(stat --printf='%s' "$APK")" -gt 50000

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ursafe-Remote-QA-v2.0-debug-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Export build metadata
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          APK='source/app/build/outputs/apk/debug/app-debug.apk'
          mkdir -p artifact/ursafe-build-output
          cp "$APK" artifact/ursafe-build-output/Ursafe-Remote-QA-v2.0-debug.apk
          sha256sum "$APK" | awk '{print $1}' > artifact/ursafe-build-output/Ursafe-Remote-QA-v2.0-debug.apk.sha256
          stat --printf='%s\n' "$APK" > artifact/ursafe-build-output/Ursafe-Remote-QA-v2.0-debug.apk.size
          printf '%s\n' '${{ github.run_id }}' > artifact/ursafe-build-output/run-id.txt
          date -u +'%Y-%m-%dT%H:%M:%SZ' > artifact/ursafe-build-output/built-at.txt

      - name: Commit build artifact and metadata
        if: github.event_name == 'push'
        working-directory: artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ursafe-build-output
          git commit -m 'build: Ursafe Remote QA v2.0 debug APK' || exit 0
          git push origin HEAD:ursafe-v02-artifact

