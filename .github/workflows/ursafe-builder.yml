name: Build Ursafe APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ursafe-builder.yml'
  pull_request:
    branches: [main]
    paths:
      - '.ursafe-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ursafe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Ursafe source
        uses: actions/checkout@v4
        with:
          ref: ursafe-v02-build
          path: source

      - name: Checkout artifact branch
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: ursafe-v02-artifact
          path: artifact

      - name: Normalize SafeJson overloads
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/ursafe/app/QaSessionManager.java')
          text = path.read_text(encoding='utf-8')
          marker = 'private static final class SafeJson extends JSONObject {'
          if marker not in text:
              raise SystemExit('SafeJson marker missing')
          if 'put(String name, boolean value)' not in text:
              overloads = '''private static final class SafeJson extends JSONObject {
                  @Override public SafeJson put(String name, boolean value) {
                      try { super.put(name, value); } catch (Exception ignored) {}
                      return this;
                  }
                  @Override public SafeJson put(String name, double value) {
                      try { super.put(name, value); } catch (Exception ignored) {}
                      return this;
                  }
                  @Override public SafeJson put(String name, int value) {
                      try { super.put(name, value); } catch (Exception ignored) {}
                      return this;
                  }
                  @Override public SafeJson put(String name, long value) {
                      try { super.put(name, value); } catch (Exception ignored) {}
                      return this;
                  }'''
              text = text.replace(marker, overloads, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Patch Number Match v2 calibration
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/ursafe/app/NumberMatchAgent.java')
          text = path.read_text(encoding='utf-8')
          old_grid = '''        double left = width * 0.033;
                  double right = width * 0.967;
                  double top = height * 0.201;
                  double cell = (right - left) / COLS;'''
          new_grid = '''        double[] grid = NumberMatchCalibration.detect(
                          buffer, rowStride, pixelStride, width, height);
                  double left = grid[0];
                  double right = grid[1];
                  double top = grid[2];
                  double cell = grid[3];'''
          if old_grid not in text:
              raise SystemExit('Number Match grid marker missing')
          text = text.replace(old_grid, new_grid, 1)
          old_confirm = '''                waitingForChange = false;
                          unchangedFrames = 0;
                          noPairFrames = 0;
                          status = "BOARD UPDATED";
                          return;'''
          new_confirm = '''                waitingForChange = false;
                          unchangedFrames = 0;
                          noPairFrames = 0;
                          moves++;
                          status = "MOVE CONFIRMED " + moves;
                          return;'''
          if old_confirm not in text:
              raise SystemExit('Number Match confirmation marker missing')
          text = text.replace(old_confirm, new_confirm, 1)
          old_false_count = '''            lastActionMs = nowMs;
                      moves++;
                      noPairFrames = 0;'''
          new_false_count = '''            lastActionMs = nowMs;
                      noPairFrames = 0;'''
          if old_false_count not in text:
              raise SystemExit('Number Match move counter marker missing')
          text = text.replace(old_false_count, new_false_count, 1)
          text = text.replace('status = String.format(Locale.US, "MOVE %d: %d + %d", moves, pair.a, pair.b);',
                              'status = String.format(Locale.US, "TRY: %d + %d", pair.a, pair.b);', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Build debug APK
        working-directory: source
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          APK='source/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          unzip -t "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ursafe-Live-QA-v1.2-debug-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Export build metadata
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          APK='source/app/build/outputs/apk/debug/app-debug.apk'
          mkdir -p artifact/ursafe-build-output
          sha256sum "$APK" | awk '{print $1}' > artifact/ursafe-build-output/Ursafe-Live-QA-v1.2-debug.apk.sha256
          stat --printf='%s\n' "$APK" > artifact/ursafe-build-output/Ursafe-Live-QA-v1.2-debug.apk.size
          printf '%s\n' '${{ github.run_id }}' > artifact/ursafe-build-output/run-id.txt
          date -u +'%Y-%m-%dT%H:%M:%SZ' > artifact/ursafe-build-output/built-at.txt

      - name: Commit build metadata
        if: github.event_name == 'push'
        working-directory: artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ursafe-build-output
          git commit -m 'build: Ursafe Live QA v1.2 debug APK' || exit 0
          git push origin HEAD:ursafe-v02-artifact

