name: Build Ursafe APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ursafe-builder.yml'
  pull_request:
    branches: [main]
    paths:
      - '.ursafe-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ursafe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Ursafe source
        uses: actions/checkout@v4
        with:
          ref: ursafe-v02-build
          path: source

      - name: Checkout artifact branch
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: ursafe-v02-artifact
          path: artifact

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Build debug APK
        working-directory: source
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          APK='source/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          unzip -t "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ursafe-QA-Lab-v1.1-debug-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Export build metadata
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          APK='source/app/build/outputs/apk/debug/app-debug.apk'
          mkdir -p artifact/ursafe-build-output
          sha256sum "$APK" | awk '{print $1}' > artifact/ursafe-build-output/Ursafe-QA-Lab-v1.1-debug.apk.sha256
          stat --printf='%s\n' "$APK" > artifact/ursafe-build-output/Ursafe-QA-Lab-v1.1-debug.apk.size
          printf '%s\n' '${{ github.run_id }}' > artifact/ursafe-build-output/run-id.txt
          date -u +'%Y-%m-%dT%H:%M:%SZ' > artifact/ursafe-build-output/built-at.txt

      - name: Commit build metadata
        if: github.event_name == 'push'
        working-directory: artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ursafe-build-output
          git commit -m 'build: Ursafe QA Lab v1.1 debug APK'
          git push origin HEAD:ursafe-v02-artifact

