name: Build TTC Bridge APK

on:
  push:
    branches: ["ttc-bridge-v2"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source archive
        run: |
          cat chunks/*.b64 | tr -d '\n\r ' | base64 --decode > ttc_bridge_v2_source.zip
          unzip -q ttc_bridge_v2_source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        working-directory: ttc_bridge_v2
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ttc-bridge-debug-apk
          path: ttc_bridge_v2/app/build/outputs/apk/debug/app-debug.apk
