name: Build xuci1.0 Local AI APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'xuci-local-patches/**'
      - '.github/workflows/xuci-local-ai-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-local-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout xuci patches
        uses: actions/checkout@v4
        with:
          path: patches

      - name: Checkout official llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: master
          fetch-depth: 1
          path: source

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'platform-tools' \
            'ndk;29.0.13113456' \
            'cmake;3.31.6'

      - name: Apply xuci local patches
        run: |
          set -euo pipefail
          APP='source/examples/llama.android/app'
          LIB='source/examples/llama.android/lib'

          cp patches/xuci-local-patches/MainActivity.kt \
            "$APP/src/main/java/com/example/llama/MainActivity.kt"
          cp patches/xuci-local-patches/activity_main.xml \
            "$APP/src/main/res/layout/activity_main.xml"
          cp patches/xuci-local-patches/AndroidManifest.xml \
            "$APP/src/main/AndroidManifest.xml"

          python3 - <<'PY'
          from pathlib import Path

          app = Path('source/examples/llama.android/app/build.gradle.kts')
          text = app.read_text()
          text = text.replace('applicationId = "com.example.llama.aichat"', 'applicationId = "ai.xuci.local"')
          text = text.replace('minSdk = 33', 'minSdk = 28')
          text = text.replace('versionCode = 1', 'versionCode = 3')
          text = text.replace('versionName = "1.0"', 'versionName = "0.3.0-local-alpha"')
          app.write_text(text)

          lib = Path('source/examples/llama.android/lib/build.gradle.kts')
          text = lib.read_text()
          text = text.replace('minSdk = 33', 'minSdk = 28')
          text = text.replace('abiFilters += listOf("arm64-v8a", "x86_64")', 'abiFilters += listOf("arm64-v8a")')
          lib.write_text(text)
          PY

      - name: Build arm64 debug APK
        working-directory: source/examples/llama.android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --stacktrace :app:assembleDebug 2>&1 | tee ../../../xuci-local-build.log

      - name: Validate APK
        run: |
          set -euo pipefail
          APK='source/examples/llama.android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          sha256sum "$APK" | tee xuci1.0-local-alpha.apk.sha256
          cp "$APK" xuci1.0-local-alpha.apk
          stat --printf='%s\n' "$APK" > xuci1.0-local-alpha.apk.size

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuci1.0-local-build-log
          path: xuci-local-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: xuci1.0-local-alpha-apk
          path: |
            xuci1.0-local-alpha.apk
            xuci1.0-local-alpha.apk.sha256
            xuci1.0-local-alpha.apk.size
          if-no-files-found: error
          retention-days: 7
