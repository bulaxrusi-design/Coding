name: Build xuci1.0 Gemini Free Agent 0.9 APK

on:
  push:
    branches: [xuci-gemini-v09]
    paths:
      - 'xuci_gemini_v09_payload/**'
      - '.github/workflows/xuci-gemini-v09-build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Reconstruct source
        run: |
          cat xuci_gemini_v09_payload/chunk_* | base64 -d > /tmp/xuci-gemini-v09-source.zip
          echo 'c888085f03c8c53b9cb2d000d8690a01a99aa6cbf5f75f133ff6f3bee6625e4b  /tmp/xuci-gemini-v09-source.zip' | sha256sum -c -
          unzip -t /tmp/xuci-gemini-v09-source.zip
          unzip -q /tmp/xuci-gemini-v09-source.zip
          test -f xuci_gemini_v09/app/src/main/java/ai/xuci/toolhub/AgentController.java
          grep -q 'versionCode 9' xuci_gemini_v09/app/build.gradle
          grep -q 'generateContent' xuci_gemini_v09/app/src/main/java/ai/xuci/toolhub/AgentController.java
          ! grep -q 'httpie' xuci_gemini_v09/app/src/main/java/ai/xuci/toolhub/MainActivity.java

      - name: Build debug APK
        working-directory: xuci_gemini_v09
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify and stage APK
        run: |
          APK=xuci_gemini_v09/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK"
          mkdir -p dist
          cp "$APK" dist/xuci1.0-gemini-free-v0.9-debug.apk
          sha256sum dist/xuci1.0-gemini-free-v0.9-debug.apk | tee dist/xuci1.0-gemini-free-v0.9-debug.apk.sha256
          unzip -l "$APK" | grep -E 'AndroidManifest.xml|classes.dex|resources.arsc'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xuci1.0-gemini-free-v09-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 14
