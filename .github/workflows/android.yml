name: Build ChatGPT Device Lab v2.1 APK

on:
  push:
    branches: ["device-lab-v2.1-build"]
    paths-ignore:
      - "dist/**"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Apply v2.1 foreground resolver
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('device_lab_v2/app/src/main/java/com/ttclab/chatbridge/BridgeService.kt')
          s = p.read_text()
          old = 'val foreground = BridgeAccessibilityService.foregroundPackage ?: "unknown"'
          new = 'val foreground = BridgeAccessibilityService.resolveForegroundPackage() ?: "unknown"'
          if old not in s:
              raise SystemExit('Expected foreground resolver line not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Build debug APK
        working-directory: device_lab_v2
        run: gradle --no-daemon assembleDebug
      - name: Stage APK
        run: |
          mkdir -p dist
          cp device_lab_v2/app/build/outputs/apk/debug/app-debug.apk dist/ChatGPT-Device-Lab-v2.1-debug.apk
          sha256sum dist/ChatGPT-Device-Lab-v2.1-debug.apk | tee dist/ChatGPT-Device-Lab-v2.1-debug.apk.sha256
      - name: Publish APK on branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ChatGPT-Device-Lab-v2.1-debug.apk dist/ChatGPT-Device-Lab-v2.1-debug.apk.sha256
          if git diff --cached --quiet; then
            echo "No APK changes"
          else
            git commit -m "Build ChatGPT Device Lab v2.1 APK [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-device-lab-v2.1-debug-apk
          path: |
            dist/ChatGPT-Device-Lab-v2.1-debug.apk
            dist/ChatGPT-Device-Lab-v2.1-debug.apk.sha256
