name: Build ChatGPT Device Lab v2.1 APK

on:
  push:
    branches: ["ttc-bridge-v3"]
    paths:
      - "BUILD_TRIGGER_V21.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Reconstruct and unpack source
        run: |
          cat source_chunks/part-00.b64 v21_chunks/part-*.b64 | base64 --decode > device_lab_v21_project.zip
          unzip -q device_lab_v21_project.zip -d build-src
      - name: Build debug APK
        working-directory: build-src/chatgpt_device_lab_v2
        run: gradle --no-daemon assembleDebug
      - name: Stage APK
        run: |
          mkdir -p dist
          cp build-src/chatgpt_device_lab_v2/app/build/outputs/apk/debug/app-debug.apk dist/ChatGPT-Device-Lab-v2.1-debug.apk
          sha256sum dist/ChatGPT-Device-Lab-v2.1-debug.apk | tee dist/ChatGPT-Device-Lab-v2.1-debug.apk.sha256
      - name: Publish APK on branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ChatGPT-Device-Lab-v2.1-debug.apk dist/ChatGPT-Device-Lab-v2.1-debug.apk.sha256
          if git diff --cached --quiet; then
            echo "No APK changes"
          else
            git commit -m "Build ChatGPT Device Lab v2.1 APK [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-device-lab-v21-debug-apk
          path: |
            dist/ChatGPT-Device-Lab-v2.1-debug.apk
            dist/ChatGPT-Device-Lab-v2.1-debug.apk.sha256
