name: Build ChatGPT Device Lab v2.2 APK

on:
  push:
    branches: ["device-lab-v2.2-build"]
    paths-ignore:
      - "dist/**"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Run unit tests, lint and APK build
        working-directory: device_lab_v2
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify security-critical source settings
        run: |
          grep -q 'android:canRetrieveWindowContent="true"' device_lab_v2/app/src/main/res/xml/accessibility_service_config.xml
          grep -q 'android.permission.PACKAGE_USAGE_STATS' device_lab_v2/app/src/main/AndroidManifest.xml
          grep -q 'android:foregroundServiceType="mediaProjection"' device_lab_v2/app/src/main/AndroidManifest.xml
          grep -q 'versionName = "2.2.0"' device_lab_v2/app/build.gradle.kts
          grep -q 'versionCode = 4' device_lab_v2/app/build.gradle.kts
      - name: Verify APK metadata
        run: |
          APK=device_lab_v2/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionCode='4'" /tmp/badging.txt
          grep -q "versionName='2.2.0'" /tmp/badging.txt
          grep -q "application-label:'ChatGPT Device Lab v2.2'" /tmp/badging.txt
      - name: Stage APK
        run: |
          mkdir -p dist
          cp device_lab_v2/app/build/outputs/apk/debug/app-debug.apk dist/ChatGPT-Device-Lab-v2.2.0-debug.apk
          sha256sum dist/ChatGPT-Device-Lab-v2.2.0-debug.apk | tee dist/ChatGPT-Device-Lab-v2.2.0-debug.apk.sha256
          printf '%s\n' "$GITHUB_RUN_ID" > dist/latest_v22_run_id.txt
      - name: Publish APK on branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ChatGPT-Device-Lab-v2.2.0-debug.apk dist/ChatGPT-Device-Lab-v2.2.0-debug.apk.sha256 dist/latest_v22_run_id.txt
          if git diff --cached --quiet; then
            echo "No APK changes"
          else
            git commit -m "Build ChatGPT Device Lab v2.2 APK [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-device-lab-v2.2-debug-apk
          path: |
            dist/ChatGPT-Device-Lab-v2.2.0-debug.apk
            dist/ChatGPT-Device-Lab-v2.2.0-debug.apk.sha256
            device_lab_v2/app/build/reports/lint-results-debug.html
            device_lab_v2/app/build/reports/tests/testDebugUnitTest/
